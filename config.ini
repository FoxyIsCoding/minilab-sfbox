[midi]
# substring(s) to find the MiniLab input/output port (comma separated)
input_keywords = minilab
# substring(s) to find the fluidsynth ALSA output port
fluid_keywords = fluid,synth

[controls]
# CC of the knob used to browse instruments (highlight; click loads).
# Find yours with: python3 app.py --learn
preset_cc = 16
# main encoder below the display (CC 28, relative) also browses.
# encoder_mode: auto (relative near 60..68, else absolute) | absolute | relative2
encoder_cc = 28
encoder_mode = auto
# The "click" control. The MiniLab 3's main encoder sends NOTHING when pressed
# (verified: 5 presses + a hold + a double-press produced zero MIDI messages),
# so a spare pad is the click by default: single = confirm, double = menu,
# long = favourite. 38 = pad 3 (36/37 = prev/next preset, 42/43 = soundfont).
# Units whose encoder does report a press can set click_cc instead (0 = off).
click_note = 38
click_cc = 0
# click gesture windows (ms)
click_single_ms = 350
click_double_ms = 400
click_long_ms = 800
# MiniLab pads channel (0-based) - unused pads act as encoder click fallback
pad_channel = 9
# absolute = knob position maps across preset list.
# relative2 = endless encoder (set knob to Relative #2 in Arturia MIDI Control Center)
knob_mode = absolute
# MIDI notes for prev/next instrument (MiniLab Bank-A Pad1=C1=36, Pad2=C#1=37 by default)
prev_note = 36
next_note = 37
# pads 7/8 jump to the first preset of the prev/next soundfont file (42/43)
sf_prev_note = 42
sf_next_note = 43

[confirm]
# highlight-then-click browsing: scroll moves ">", click (or first key
# press, if on_note) loads it. Pads + program-change always load directly.
on_note = true

[menu]
# double-click the encoder for the mode menu:
#   instruments | soundfonts | favorites | star | volume | close
mode = instruments

[preview]
# short audition blip on the newly loaded preset
enabled = true
note = 72
vel = 70
ms = 250
# subtle ding 0.35s after a volume-fader move stops, to test the level
ding = true
ding_note = 84
ding_vel = 40
ding_ms = 150
# MIDI channel used for synth fallback program_change (0 = ch1)
midi_channel = 0

[display]
# daw | arturia | user — must match the MiniLab program you play in.
# Display SysEx is verified for DAW mode; other modes show console text only.
mode = daw

[fluid]
soundfont_dir = soundfonts
# ALSA device: use install.sh auto-detect; 'default' works, 'hw:Device' for USB DAC
audio_device = default
gain = 0.8
samplerate = 44100
# 64 is safe on Pi 2; raise to 128-256 only on Pi 3/4
polyphony = 64

[server]
# port for --serve browser uploader (0 = off by default)
port = 0

[library]
# files at/below this size preload at boot (fast). Bigger ones load in the
# background the first time you select them, then stay cached.
preload_max_mb = 8
# cap for background-loaded samples; oldest unused files unload past this.
# 256MB is safe on a 1GB Pi 2; raise on bigger machines.
mem_cap_mb = 256

[volume]
# CC of the first slider -> loudness. 0 = disabled.
# backend: fluid = synth master gain 0..125% (default, works everywhere).
#   amixer/pactl = OS mixer instead (capped 100%; amixer needs the right
#   control name: "Headphone" on Pi onboard audio, often Speaker/PCM on USB DACs).
# (MiniLab map discovered 2026-09-28: fader1=CC14. Swap with pan's CC if reversed.)
cc = 14
backend = fluid
# amixer settings (Pi / USB DAC: control is often Master, PCM or Speaker)
card = default
control = Master
# min ms between volume backend calls during fast sweeps
cooldown_ms = 40

[pan]
# CC of the 4th slider -> stereo pan (MIDI CC10). 0 = disabled.
# (discovered: fader4=CC31)
cc = 31

[fx]
# CC per knob for built-in effects. 0 = disabled. knob_mode (above) applies.
# reverb/room/damp/chorus = fluidsynth DSP; bass = sub-octave layer;
# bright/attack/release = filter cutoff / env attack / env release.
# (discovered 2026-09-28, knobs left-to-right; reorder if your unit differs)
cc_reverb = 86
cc_room = 87
cc_damp = 89
cc_chorus = 90
cc_bass = 110
cc_bright = 111
cc_attack = 116
cc_release = 117
# top of each knob's range (127 = normal). bass is a BOOSTER: top 254 means
# the knob runs 0-200%, past 100% it stacks a second sub-octave (-24) so the
# top half really is more low end instead of a dead zone. def_* = start pos.
top_reverb = 127
top_room = 127
top_damp = 127
top_chorus = 127
top_bass = 254
top_bright = 127
top_attack = 127
top_release = 127
def_bass = 25
